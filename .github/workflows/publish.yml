name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright
        run: bun x playwright install

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"

      - name: Update npm CLI
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance --access public
